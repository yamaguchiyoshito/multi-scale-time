<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">メロディーの終わりは、保持と予感の構造が変わることで経験される</title>
<desc id="desc">進行中は次の音への予感がある。終結では予感が変わり、最後の音が全体の印象へ統合される</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="580" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     06     図6-4</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">メロディーの終わりは、保持と予感の構造が変わることで経験される</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">進行中は次の音への予感がある。終結では予感が変わり、最後の音が全体の印象へ統合される</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="200.0" width="500.0" height="320.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="320.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">進行中</text>
<line x1="110.0" y1="400.0" x2="530.0" y2="400.0" stroke="#d8d4c8" stroke-width="2"/>
<circle cx="170.0" cy="380.0" r="11" fill="#2f8f83"/>
<line x1="170.0" y1="380.0" x2="170.0" y2="340.0" stroke="#2f8f83" stroke-width="2.5"/>
<circle cx="250.0" cy="360.0" r="11" fill="#2f8f83"/>
<line x1="250.0" y1="360.0" x2="250.0" y2="320.0" stroke="#2f8f83" stroke-width="2.5"/>
<circle cx="330.0" cy="380.0" r="11" fill="#2f8f83"/>
<line x1="330.0" y1="380.0" x2="330.0" y2="340.0" stroke="#2f8f83" stroke-width="2.5"/>
<circle cx="430.0" cy="370.0" r="11" fill="none" stroke="#2f8f83" stroke-width="2.2" stroke-dasharray="7 6"/>
<text x="430.0" y="330.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">次の音？</text>
<text x="430.0" y="440.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">予感がある</text>
<text x="320.0" y="490.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">続くという期待の中で聴いている</text>
<rect x="630.0" y="200.0" width="500.0" height="320.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="880.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">終結</text>
<line x1="670.0" y1="400.0" x2="1090.0" y2="400.0" stroke="#d8d4c8" stroke-width="2"/>
<circle cx="730.0" cy="380.0" r="11" fill="#2f8f83"/>
<line x1="730.0" y1="380.0" x2="730.0" y2="340.0" stroke="#2f8f83" stroke-width="2.5"/>
<circle cx="810.0" cy="360.0" r="11" fill="#2f8f83"/>
<line x1="810.0" y1="360.0" x2="810.0" y2="320.0" stroke="#2f8f83" stroke-width="2.5"/>
<circle cx="890.0" cy="380.0" r="11" fill="#2f8f83"/>
<line x1="890.0" y1="380.0" x2="890.0" y2="340.0" stroke="#2f8f83" stroke-width="2.5"/>
<circle cx="970.0" cy="380.0" r="11" fill="#2f8f83"/>
<line x1="970.0" y1="380.0" x2="970.0" y2="340.0" stroke="#2f8f83" stroke-width="2.5"/>
<text x="1040.0" y="376.0" fill="#5d6873" font-size="22" text-anchor="middle" font-weight="400">×</text>
<text x="1040.0" y="440.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">予感が消える</text>
<path d="M 720.0 410.0 Q 720.0 420.0 732.0 420.0 L 843.0 420.0 Q 855.0 420.0 855.0 430.0 Q 855.0 420.0 867.0 420.0 L 978.0 420.0 Q 990.0 420.0 990.0 410.0" fill="none" stroke="#5d6873" stroke-width="1.6"/>
<text x="855.0" y="452.0" fill="#c7792b" font-size="14" text-anchor="middle" font-weight="700">保持 → 全体の印象へ統合</text>
<text x="880.0" y="490.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">終結を示す音型で「ここで終わる」と予測される</text>
</g>
</svg>
