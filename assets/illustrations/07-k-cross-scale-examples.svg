<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">長い尺度が、短い尺度を変える</title>
<desc id="desc">睡眠不足、炎症、運動習慣。長い時間で形成された状態が、瞬間の反応を左右する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     07     図7-11</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">長い尺度が、短い尺度を変える</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">睡眠不足、炎症、運動習慣。長い時間で形成された状態が、瞬間の反応を左右する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="80.0" y="230.0" width="300.0" height="76.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="230.0" y="264.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">数日の睡眠不足</text>
<text x="230.0" y="294.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">尺度：日</text>
<line x1="230.0" y1="312.0" x2="230.0" y2="390.0" stroke="#2b5f9e" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="80.0" y="396.0" width="300.0" height="76.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="230.0" y="430.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">翌日の注意・反応速度</text>
<text x="230.0" y="460.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">尺度：秒</text>
<rect x="420.0" y="230.0" width="300.0" height="76.0" rx="14" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="570.0" y="264.0" fill="#c7792b" font-size="17" text-anchor="middle" font-weight="700">数日続く炎症</text>
<text x="570.0" y="294.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">尺度：日〜週</text>
<line x1="570.0" y1="312.0" x2="570.0" y2="390.0" stroke="#c7792b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
<rect x="420.0" y="396.0" width="300.0" height="76.0" rx="14" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="570.0" y="430.0" fill="#c7792b" font-size="17" text-anchor="middle" font-weight="700">いまの疲労感</text>
<text x="570.0" y="460.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">尺度：いま</text>
<rect x="760.0" y="230.0" width="300.0" height="76.0" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="910.0" y="264.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">長年の運動習慣</text>
<text x="910.0" y="294.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">尺度：年</text>
<line x1="910.0" y1="312.0" x2="910.0" y2="390.0" stroke="#2f8f83" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
<rect x="760.0" y="396.0" width="300.0" height="76.0" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="910.0" y="430.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">一瞬の運動能力</text>
<text x="910.0" y="460.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">尺度：一瞬</text>
<path d="M 1080 396 C 1112 354 1112 354 1080 312" fill="none" stroke="#5d6873" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="1098.0" y="492.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">逆向きもある</text>
<text x="600.0" y="528.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">短い時間と長い時間は並んでいるのではなく、互いの状態を変えながら一つの生命活動を形成する</text>
</g>
</svg>
