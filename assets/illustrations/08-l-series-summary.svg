<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">全8回の論理の到達点</title>
<desc id="desc">時間知覚の制約から、マルチ時間スケールによる時間経験の成立へ</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="680" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     08     図8-12</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">全8回の論理の到達点</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">時間知覚の制約から、マルチ時間スケールによる時間経験の成立へ</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="140.0" y="572.0" width="760.0" height="52.0" rx="12" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="170.0" y="604.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">時間知覚の制約</text>
<text x="880.0" y="604.0" fill="#5d6873" font-size="14" text-anchor="end" font-weight="400">個体ごとに識別可能な時間スケールが異なる</text>
<text x="930.0" y="604.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">第1・2回</text>
<line x1="520.0" y1="570.0" x2="520.0" y2="560.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="140.0" y="506.0" width="760.0" height="52.0" rx="12" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="170.0" y="538.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">情報の粗視化と再構成</text>
<text x="880.0" y="538.0" fill="#5d6873" font-size="14" text-anchor="end" font-weight="400">物理的変化が知覚可能な情報へ変換される</text>
<text x="930.0" y="538.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">第2・3回</text>
<line x1="520.0" y1="504.0" x2="520.0" y2="494.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="140.0" y="440.0" width="760.0" height="52.0" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="170.0" y="472.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">意識の時間的内部</text>
<text x="880.0" y="472.0" fill="#5d6873" font-size="14" text-anchor="end" font-weight="400">遅延が記憶の参照と行動選択を可能にする</text>
<text x="930.0" y="472.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">第4回</text>
<line x1="520.0" y1="438.0" x2="520.0" y2="428.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="140.0" y="374.0" width="760.0" height="52.0" rx="12" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="170.0" y="406.0" fill="#2f8f83" font-size="18" text-anchor="start" font-weight="700">記憶と予測による現在の構成</text>
<text x="880.0" y="406.0" fill="#5d6873" font-size="14" text-anchor="end" font-weight="400">過去の保持・現在の知覚・未来の予感が統合される</text>
<text x="930.0" y="406.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">第5・6回</text>
<line x1="520.0" y1="372.0" x2="520.0" y2="362.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="140.0" y="308.0" width="760.0" height="52.0" rx="12" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="170.0" y="340.0" fill="#c7792b" font-size="18" text-anchor="start" font-weight="700">身体と環境の相互作用</text>
<text x="880.0" y="340.0" fill="#5d6873" font-size="14" text-anchor="end" font-weight="400">異なる時間スケールの生体システムが相互に影響する</text>
<text x="930.0" y="340.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">第7回</text>
<line x1="520.0" y1="306.0" x2="520.0" y2="296.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="140.0" y="242.0" width="760.0" height="52.0" rx="12" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
<text x="170.0" y="274.0" fill="#8a4f9e" font-size="18" text-anchor="start" font-weight="700">マルチ時間スケールによる時間経験の成立</text>
<text x="880.0" y="274.0" fill="#5d6873" font-size="14" text-anchor="end" font-weight="400">複数の時間的過程が統合され、一つの「現在」が経験される</text>
<text x="930.0" y="274.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">第8回</text>
<text x="50.0" y="652.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">時間の流れは単に知覚されるのではなく、生物の情報処理によって経験として構成される。</text>
</g>
</svg>
