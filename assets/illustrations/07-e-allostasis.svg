<text x="440.0" y="262.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">先回りの調節</text>
<text x="440.0" y="280.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="400">（アロスタシス）</text>
<text x="50.0" y="552.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">現在の身体状態は、過去の変化の結果であり、未来の要求へ向けた調節の途中にある。</text>
