<circle cx="885.5" cy="450.0" r="8" fill="#c7792b"/>
<text x="885.5" y="404.0" fill="#c7792b" font-size="14" text-anchor="middle" font-weight="700">身体状態の認識</text>
<text x="885.5" y="422.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">数秒</text>
<line x1="1003.1" y1="300.0" x2="885.5" y2="440.0" stroke="#c7792b" stroke-width="1.4" stroke-dasharray="8 7"/>
<text x="50.0" y="532.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">同じ現象が、二本の軸では別の位置に置かれる。両者の違いがマルチ時間スケールの出発点である。</text>
