<text x="1050.0" y="318.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">10秒</text>
<text x="80.0" y="296.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="700">現象の進行速度</text>
<text x="80.0" y="318.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">（物理的な尺度）</text>
