<text x="80.0" y="456.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="700">経験の統合幅</text>
<text x="80.0" y="478.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">（情報処理の尺度）</text>
