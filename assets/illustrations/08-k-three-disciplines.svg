<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">同じ「時間」をめぐる三つの問い</title>
<desc id="desc">物理学、哲学、認知科学はそれぞれ異なる問題を扱う。本連載の位置は認知科学と哲学の重なりにある</desc>
<defs><radialGradient id="g08k-1"><stop offset="0" stop-color="#c7792b" stop-opacity="0.8"/><stop offset="0.55" stop-color="#c7792b" stop-opacity="0.36"/><stop offset="1" stop-color="#c7792b" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="730" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     08     図8-11</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">同じ「時間」をめぐる三つの問い</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">物理学、哲学、認知科学はそれぞれ異なる問題を扱う。本連載の位置は認知科学と哲学の重なりにある</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="450.0" cy="360.0" r="150" fill="none" stroke="#2b5f9e" stroke-width="2.5"/>
<circle cx="750.0" cy="360.0" r="150" fill="none" stroke="#8a4f9e" stroke-width="2.5"/>
<circle cx="600.0" cy="500.0" r="150" fill="none" stroke="#2f8f83" stroke-width="2.5"/>
<text x="370.0" y="300.0" fill="#2b5f9e" font-size="20" text-anchor="middle" font-weight="700">物理学</text>
<text x="370.0" y="330.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">出来事の順序と間隔</text>
<text x="370.0" y="350.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">物理法則による変化</text>
<text x="830.0" y="300.0" fill="#8a4f9e" font-size="20" text-anchor="middle" font-weight="700">哲学</text>
<text x="830.0" y="330.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">時間の存在と方向性</text>
<text x="830.0" y="350.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">過去・現在・未来の関係</text>
<text x="600.0" y="590.0" fill="#2f8f83" font-size="20" text-anchor="middle" font-weight="700">認知科学</text>
<text x="600.0" y="618.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">生物が時間をどう知覚し、</text>
<text x="600.0" y="638.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">推定し、記憶するか</text>
<circle cx="672.0" cy="448.0" r="46" fill="url(#g08k-1)"/>
<text x="672.0" y="452.0" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="700">本連載</text>
<text x="960.0" y="470.0" fill="#c7792b" font-size="14" text-anchor="start" font-weight="700">生物にとっての時間経験</text>
<line x1="950.0" y1="466.0" x2="720.0" y2="452.0" stroke="#c7792b" stroke-width="1.5" stroke-dasharray="8 7"/>
<text x="50.0" y="702.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">時間の実在や方向性、決定論との関係には、なお別の検討が要る。</text>
</g>
</svg>
