<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">連載の見取り図</title>
<desc id="desc">「測る」から「経験する」へ。3部8回で、心の時間的構造から身体と統合へ進む</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     01     図1-5</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">連載の見取り図</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">「測る」から「経験する」へ。3部8回で、心の時間的構造から身体と統合へ進む</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="210.0" width="340.0" height="300.0" rx="18" fill="#ffffff" stroke="#2b5f9e" stroke-width="2.5"/>
<text x="240.0" y="246.0" fill="#2b5f9e" font-size="17" text-anchor="middle" font-weight="700">第I部　時間を測る、時間を感じる</text>
<rect x="94.0" y="292.0" width="292.0" height="46.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="110.0" y="322.0" fill="#2b5f9e" font-size="14" text-anchor="start" font-weight="700">第1回</text>
<text x="182.0" y="322.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">時計の時間と経験の時間</text>
<rect x="94.0" y="356.0" width="292.0" height="46.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="110.0" y="386.0" fill="#2b5f9e" font-size="14" text-anchor="start" font-weight="700">第2回</text>
<text x="182.0" y="386.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">時間知覚の限界</text>
<rect x="94.0" y="420.0" width="292.0" height="46.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="110.0" y="450.0" fill="#2b5f9e" font-size="14" text-anchor="start" font-weight="700">第3回</text>
<text x="182.0" y="450.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">脳による世界の再構成</text>
<line x1="416.0" y1="360.0" x2="442.0" y2="360.0" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="445.0" y="210.0" width="340.0" height="300.0" rx="18" fill="#ffffff" stroke="#2f8f83" stroke-width="2.5"/>
<text x="615.0" y="246.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">第II部　心の時間的構造</text>
<rect x="469.0" y="292.0" width="292.0" height="46.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="485.0" y="322.0" fill="#2f8f83" font-size="14" text-anchor="start" font-weight="700">第4回</text>
<text x="557.0" y="322.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">遅延と行動の選択</text>
<rect x="469.0" y="356.0" width="292.0" height="46.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="485.0" y="386.0" fill="#2f8f83" font-size="14" text-anchor="start" font-weight="700">第5回</text>
<text x="557.0" y="386.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">記憶が現在を構成する</text>
<rect x="469.0" y="420.0" width="292.0" height="46.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="485.0" y="450.0" fill="#2f8f83" font-size="14" text-anchor="start" font-weight="700">第6回</text>
<text x="557.0" y="450.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">厚みのある現在</text>
<line x1="791.0" y1="360.0" x2="817.0" y2="360.0" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="820.0" y="210.0" width="340.0" height="300.0" rx="18" fill="#ffffff" stroke="#c7792b" stroke-width="2.5"/>
<text x="990.0" y="246.0" fill="#c7792b" font-size="17" text-anchor="middle" font-weight="700">第III部　身体と統合</text>
<rect x="844.0" y="292.0" width="292.0" height="46.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="860.0" y="322.0" fill="#c7792b" font-size="14" text-anchor="start" font-weight="700">第7回</text>
<text x="932.0" y="322.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">身体と環境の相互作用</text>
<rect x="844.0" y="356.0" width="292.0" height="46.0" rx="10" fill="#c7792b" stroke="none" stroke-width="0" opacity="0.85"/>
<text x="860.0" y="386.0" fill="#ffffff" font-size="14" text-anchor="start" font-weight="700">第8回</text>
<text x="932.0" y="386.0" fill="#ffffff" font-size="15" text-anchor="start" font-weight="400">マルチ時間スケール</text>
<text x="600.0" y="560.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">時間とは何か　→　生物はどのような仕組みで時間を経験するのか</text>
<text x="600.0" y="590.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">問いは物理学的なものから、生物学的・認知的なものへ移る</text>
</g>
</svg>
