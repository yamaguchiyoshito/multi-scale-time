<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">時間経験は、一か所にない</title>
<desc id="desc">複数の脳領域が異なる働きを担い、身体の状態と行動・環境の循環がそれに影響する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     08     図8-9</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">時間経験は、一か所にない</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">複数の脳領域が異なる働きを担い、身体の状態と行動・環境の循環がそれに影響する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<ellipse cx="560" cy="380" rx="300" ry="170" fill="#ffffff" stroke="#2b5f9e" stroke-width="2.5"/>
<text x="560.0" y="236.0" fill="#2b5f9e" font-size="18" text-anchor="middle" font-weight="700">脳</text>
<rect x="360.0" y="276.0" width="160.0" height="48.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="440.0" y="297.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">前頭前皮質</text>
<text x="440.0" y="315.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">予測・計画</text>
<rect x="560.0" y="276.0" width="160.0" height="48.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="640.0" y="297.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">補足運動野</text>
<text x="640.0" y="315.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">タイミング</text>
<rect x="300.0" y="376.0" width="160.0" height="48.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="380.0" y="397.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">基底核</text>
<text x="380.0" y="415.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">長さの推定</text>
<rect x="620.0" y="386.0" width="160.0" height="48.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="700.0" y="407.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">小脳</text>
<text x="700.0" y="425.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">運動の時間調整</text>
<rect x="460.0" y="446.0" width="160.0" height="48.0" rx="10" fill="#ece9e0" stroke="none" stroke-width="0"/>
<text x="540.0" y="467.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">海馬</text>
<text x="540.0" y="485.0" fill="#5d6873" font-size="11" text-anchor="middle" font-weight="400">順序・想起</text>
<text x="560.0" y="380.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">中央時計はない</text>
<rect x="70.0" y="320.0" width="160.0" height="120.0" rx="12" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
<text x="150.0" y="352.0" fill="#8a4f9e" font-size="13" text-anchor="middle" font-weight="400">身体の状態</text>
<text x="150.0" y="374.0" fill="#8a4f9e" font-size="13" text-anchor="middle" font-weight="400">心拍・呼吸</text>
<text x="150.0" y="396.0" fill="#8a4f9e" font-size="13" text-anchor="middle" font-weight="400">ホルモン・免疫</text>
<text x="150.0" y="418.0" fill="#8a4f9e" font-size="13" text-anchor="middle" font-weight="400">睡眠</text>
<line x1="235.0" y1="380.0" x2="262.0" y2="380.0" stroke="#8a4f9e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="960.0" y="320.0" width="170.0" height="120.0" rx="12" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="1045.0" y="352.0" fill="#c7792b" font-size="13" text-anchor="middle" font-weight="400">環境</text>
<text x="1045.0" y="374.0" fill="#c7792b" font-size="13" text-anchor="middle" font-weight="400">行動が環境を変え</text>
<text x="1045.0" y="396.0" fill="#c7792b" font-size="13" text-anchor="middle" font-weight="400">新しい入力が</text>
<text x="1045.0" y="418.0" fill="#c7792b" font-size="13" text-anchor="middle" font-weight="400">戻ってくる</text>
<path d="M 858 350 C 900 330 930 330 955 350" fill="none" stroke="#c7792b" stroke-width="2" marker-end="url(#arrow-amber)"/>
<path d="M 955 410 C 930 430 900 430 858 410" fill="none" stroke="#c7792b" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="600.0" y="590.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">時間経験を成立させる神経機構を理解するには、身体や環境との相互作用も含めて考える必要がある</text>
</g>
</svg>
