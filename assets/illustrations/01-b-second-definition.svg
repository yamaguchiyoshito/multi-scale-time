<text x="980.0" y="392.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">遷移に対応する放射</text>
<text x="880.0" y="300.0" fill="#232a33" font-size="18" text-anchor="start" font-weight="400">9,192,631,770 回の振動</text>
<text x="880.0" y="330.0" fill="#232a33" font-size="18" text-anchor="start" font-weight="400">＝ 現在の 1秒（SI）</text>
<text x="880.0" y="470.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">原子の性質は安定した基準になる</text>
<text x="600.0" y="540.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="400">時間そのものを取り出すのではなく、周期的な変化を数えて、他の出来事を比べる。それが時計である。</text>
