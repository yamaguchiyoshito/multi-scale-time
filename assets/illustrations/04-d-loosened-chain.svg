<rect x="500.0" y="396.0" width="150.0" height="76.0" rx="14" fill="none" stroke="#2b5f9e" stroke-width="2" stroke-dasharray="8 7"/>
<text x="575.0" y="428.0" fill="#2b5f9e" font-size="13" text-anchor="middle" font-weight="700">内部状態</text>
<text x="575.0" y="448.0" fill="#2b5f9e" font-size="13" text-anchor="middle" font-weight="700">過去の経験</text>
<path d="M 655 434 C 690 434 690 360 715 360" fill="none" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow-teal)"/>
