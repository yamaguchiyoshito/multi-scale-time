<text x="1000.0" y="440.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">選択の可能性</text>
<text x="50.0" y="572.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">物理法則の外に出るのではない。入力と行動の関係が、内部状態と過去の経験によって媒介される。</text>
