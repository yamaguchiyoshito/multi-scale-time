<path d="M 655 434 C 690 434 690 508 715 508" fill="none" stroke="#8a4f9e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="720.0" y="486.0" width="190.0" height="44.0" rx="10" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
