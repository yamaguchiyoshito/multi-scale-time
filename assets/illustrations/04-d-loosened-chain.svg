<path d="M 655 434 C 690 434 690 434 715 434" fill="none" stroke="#c7792b" stroke-width="2" marker-end="url(#arrow-amber)"/>
<rect x="720.0" y="412.0" width="190.0" height="44.0" rx="10" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
