<circle cx="482.0" cy="264.0" r="11" fill="none" stroke="#5d6873" stroke-width="2.5"/>
<circle cx="516.0" cy="264.0" r="11" fill="none" stroke="#5d6873" stroke-width="2.5"/>
<circle cx="550.0" cy="264.0" r="11" fill="none" stroke="#5d6873" stroke-width="2.5"/>
<circle cx="584.0" cy="264.0" r="11" fill="none" stroke="#5d6873" stroke-width="2.5"/>
<circle cx="618.0" cy="264.0" r="11" fill="none" stroke="#5d6873" stroke-width="2.5"/>
<circle cx="652.0" cy="264.0" r="11" fill="none" stroke="#5d6873" stroke-width="2.5"/>
<rect x="720.0" y="236.0" width="190.0" height="56.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="815.0" y="260.0" fill="#5d6873" font-size="18" text-anchor="middle" font-weight="700">反作用</text>
<text x="815.0" y="290.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">一つに決まる</text>
<text x="560.0" y="318.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">一本の鎖で直結する</text>
<text x="80.0" y="432.0" fill="#232a33" font-size="18" text-anchor="start" font-weight="700">生物</text>
