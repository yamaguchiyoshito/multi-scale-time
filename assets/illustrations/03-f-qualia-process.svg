<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">クオリアを、静的な属性ではなく動的な過程として捉える</title>
<desc id="desc">左は層として積む見方、右は予測と修正の循環に質が伴うという本連載の仮説</desc>
<defs><marker id="arrow-2b5f9e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><radialGradient id="g03f-1"><stop offset="0" stop-color="#c23b3b" stop-opacity="0.45"/><stop offset="0.55" stop-color="#c23b3b" stop-opacity="0.20"/><stop offset="1" stop-color="#c23b3b" stop-opacity="0"/></radialGradient><marker id="arrow-8a2a2a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8a2a2a" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     03     図3-6</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">クオリアを、静的な属性ではなく動的な過程として捉える</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">左は層として積む見方、右は予測と修正の循環に質が伴うという本連載の仮説</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="200.0" width="480.0" height="380.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="310.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">静的な見方</text>
<rect x="130.0" y="270.0" width="360.0" height="60.0" rx="10" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
<text x="310.0" y="307.0" fill="#8a4f9e" font-size="16" text-anchor="middle" font-weight="700">「赤さ」（感覚の質）</text>
<rect x="130.0" y="356.0" width="360.0" height="60.0" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="310.0" y="393.0" fill="#2f8f83" font-size="16" text-anchor="middle" font-weight="700">神経活動</text>
<rect x="130.0" y="442.0" width="360.0" height="60.0" rx="10" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="310.0" y="479.0" fill="#2b5f9e" font-size="16" text-anchor="middle" font-weight="700">光の物理量（波長・強度）</text>
<text x="310.0" y="540.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">測定値を記述しても「どのような感じか」は説明されない</text>
<rect x="630.0" y="200.0" width="500.0" height="380.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="880.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">本連載の仮説</text>
<path d="M 858.1 321.9 A 96 96 0 0 1 908.1 371.9" fill="none" stroke="#2b5f9e" stroke-width="2.2" marker-end="url(#arrow-2b5f9e)"/>
<path d="M 908.1 448.1 A 96 96 0 0 1 858.1 498.1" fill="none" stroke="#2b5f9e" stroke-width="2.2" marker-end="url(#arrow-2b5f9e)"/>
<path d="M 781.9 498.1 A 96 96 0 0 1 731.9 448.1" fill="none" stroke="#2b5f9e" stroke-width="2.2" marker-end="url(#arrow-2b5f9e)"/>
<path d="M 731.9 371.9 A 96 96 0 0 1 781.9 321.9" fill="none" stroke="#2b5f9e" stroke-width="2.2" marker-end="url(#arrow-2b5f9e)"/>
<rect x="745.0" y="293.0" width="150.0" height="42.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="820.0" y="322.0" fill="#2b5f9e" font-size="14" text-anchor="middle" font-weight="700">感覚入力</text>
<rect x="841.0" y="389.0" width="150.0" height="42.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="916.0" y="418.0" fill="#2b5f9e" font-size="14" text-anchor="middle" font-weight="700">照合（予測誤差）</text>
<rect x="745.0" y="485.0" width="150.0" height="42.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="820.0" y="514.0" fill="#2b5f9e" font-size="14" text-anchor="middle" font-weight="700">内部モデルの更新</text>
<rect x="649.0" y="389.0" width="150.0" height="42.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="724.0" y="418.0" fill="#2b5f9e" font-size="14" text-anchor="middle" font-weight="700">予測</text>
<circle cx="1050.0" cy="330.0" r="70" fill="url(#g03f-1)"/>
<text x="1050.0" y="336.0" fill="#8a2a2a" font-size="18" text-anchor="middle" font-weight="700">「赤さ」</text>
<path d="M 930 390 C 980 380 1000 360 1010 345" fill="none" stroke="#8a2a2a" stroke-width="1.8" marker-end="url(#arrow-8a2a2a)" stroke-dasharray="8 7"/>
<text x="1050.0" y="372.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">過程に伴う質</text>
<text x="880.0" y="556.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="700">再構成し続ける過程に、質が伴うという仮説</text>
<text x="50.0" y="592.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">予測誤差そのものをクオリアと同一視はしない。遅延のあるシステムすべてに経験があるとも言えない。</text>
</g>
</svg>
