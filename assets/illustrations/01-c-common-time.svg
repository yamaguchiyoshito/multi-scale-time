<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">共通の時間があるから、出来事を比べ、順序づけ、同期できる</title>
<desc id="desc">客観的時間の役割は、社会の調整と同期の基盤にある</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="570" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     01     図1-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">共通の時間があるから、出来事を比べ、順序づけ、同期できる</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">客観的時間の役割は、社会の調整と同期の基盤にある</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<line x1="120.0" y1="400.0" x2="1080.0" y2="400.0" stroke="#232a33" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="150.0" y1="392.0" x2="150.0" y2="408.0" stroke="#232a33" stroke-width="1.5"/>
<text x="150.0" y="432.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">10:00</text>
<line x1="290.0" y1="392.0" x2="290.0" y2="408.0" stroke="#232a33" stroke-width="1.5"/>
<text x="290.0" y="432.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">10:05</text>
<line x1="430.0" y1="392.0" x2="430.0" y2="408.0" stroke="#232a33" stroke-width="1.5"/>
<text x="430.0" y="432.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">10:10</text>
<line x1="570.0" y1="392.0" x2="570.0" y2="408.0" stroke="#232a33" stroke-width="1.5"/>
<text x="570.0" y="432.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">10:15</text>
<line x1="710.0" y1="392.0" x2="710.0" y2="408.0" stroke="#232a33" stroke-width="1.5"/>
<text x="710.0" y="432.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">10:20</text>
<line x1="850.0" y1="392.0" x2="850.0" y2="408.0" stroke="#232a33" stroke-width="1.5"/>
<text x="850.0" y="432.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">10:25</text>
<line x1="990.0" y1="392.0" x2="990.0" y2="408.0" stroke="#232a33" stroke-width="1.5"/>
<text x="990.0" y="432.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">10:30</text>
<text x="1086.0" y="405.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">共通の時刻</text>
<rect x="150.0" y="300.0" width="420.0" height="32.0" rx="16" fill="#2b5f9e" stroke="none" stroke-width="0" opacity="0.8"/>
<text x="360.0" y="322.0" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">列車：10:00 発 → 10:30 着</text>
<line x1="150.0" y1="332.0" x2="150.0" y2="392.0" stroke="#2b5f9e" stroke-width="1" stroke-dasharray="8 7"/>
<line x1="570.0" y1="332.0" x2="570.0" y2="392.0" stroke="#2b5f9e" stroke-width="1" stroke-dasharray="8 7"/>
<circle cx="486.0" cy="250.0" r="9" fill="#c7792b"/>
<text x="486.0" y="232.0" fill="#c7792b" font-size="14" text-anchor="middle" font-weight="700">売買成立 10:12:05</text>
<line x1="486.0" y1="259.0" x2="486.0" y2="392.0" stroke="#c7792b" stroke-width="1" stroke-dasharray="8 7"/>
<circle cx="780.0" cy="250.0" r="9" fill="#2f8f83"/>
<text x="780.0" y="232.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">ログの記録 10:22:30</text>
<line x1="780.0" y1="259.0" x2="780.0" y2="392.0" stroke="#2f8f83" stroke-width="1" stroke-dasharray="8 7"/>
<rect x="900.0" y="300.0" width="170.0" height="32.0" rx="16" fill="#8a4f9e" stroke="none" stroke-width="0" opacity="0.8"/>
<text x="985.0" y="322.0" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="700">契約の期限 10:30</text>
<line x1="1010.0" y1="332.0" x2="1010.0" y2="392.0" stroke="#8a4f9e" stroke-width="1" stroke-dasharray="8 7"/>
<text x="600.0" y="488.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">比較 ・ 順序づけ ・ 同期</text>
<text x="50.0" y="542.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">時計で測れることと、時間がどのような存在かは別の問題である。</text>
</g>
</svg>
