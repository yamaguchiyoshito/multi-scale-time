<path d="M 820.0 370.0 Q 820.0 380.0 832.0 380.0 L 963.0 380.0 Q 975.0 380.0 975.0 390.0 Q 975.0 380.0 987.0 380.0 L 1118.0 380.0 Q 1130.0 380.0 1130.0 370.0" fill="none" stroke="#5d6873" stroke-width="1.6"/>
<text x="975.0" y="412.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="400">順序・期間・関係</text>
<text x="955.0" y="470.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">出来事を整合的な時間構造に組む</text>
