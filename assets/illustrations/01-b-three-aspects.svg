<line x1="912.0" y1="327.0" x2="928.0" y2="327.0" stroke="#c7792b" stroke-width="2" marker-end="url(#arrow-amber)"/>
<rect x="930.0" y="300.0" width="90.0" height="54.0" rx="14" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="975.0" y="335.0" fill="#c7792b" font-size="18" text-anchor="middle" font-weight="700">今日</text>
<line x1="1022.0" y1="327.0" x2="1038.0" y2="327.0" stroke="#c7792b" stroke-width="2" marker-end="url(#arrow-amber)"/>
