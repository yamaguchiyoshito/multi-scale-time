<text x="712.0" y="300.0" fill="#232a33" font-size="14" text-anchor="middle" font-weight="400">来年の予定</text>
<text x="595.0" y="470.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">目の前にない過去と未来を扱う</text>
<rect x="820.0" y="300.0" width="90.0" height="54.0" rx="14" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
