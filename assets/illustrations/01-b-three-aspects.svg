<text x="740.0" y="428.0" fill="#5d6873" font-size="15" text-anchor="end" font-weight="400">未来</text>
<circle cx="605.0" cy="400.0" r="8" fill="#2f8f83"/>
<text x="605.0" y="452.0" fill="#2f8f83" font-size="15" text-anchor="middle" font-weight="700">現在</text>
<path d="M 600 390 C 560 300 500 300 490 388" fill="none" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<path d="M 612 390 C 650 300 710 300 720 388" fill="none" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
