<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">同じ出来事、異なる意味</title>
<desc id="desc">一つの過去が、現在の文脈によって別の意味を持つ</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker><radialGradient id="g05d-1"><stop offset="0" stop-color="#2b5f9e" stop-opacity="0.4"/><stop offset="0.55" stop-color="#2b5f9e" stop-opacity="0.18"/><stop offset="1" stop-color="#2b5f9e" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     05     図5-4</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">同じ出来事、異なる意味</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">一つの過去が、現在の文脈によって別の意味を持つ</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="260.0" cy="370.0" r="90" fill="url(#g05d-1)"/>
<text x="260.0" y="362.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">学生時代の</text>
<text x="260.0" y="386.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">失敗</text>
<path d="M 350 370 C 450 370 480 290 560 290" fill="none" stroke="#c7792b" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="560.0" y="260.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">当時</text>
<rect x="560.0" y="266.0" width="420.0" height="50.0" rx="10" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="770.0" y="298.0" fill="#c7792b" font-size="17" text-anchor="middle" font-weight="700">恥ずかしい経験</text>
<path d="M 350 370 C 450 370 480 398 560 398" fill="none" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow-teal)"/>
<text x="560.0" y="368.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">社会人になって同じ状況で</text>
<rect x="560.0" y="374.0" width="420.0" height="50.0" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="770.0" y="406.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">判断の手掛かり</text>
<path d="M 350 370 C 450 370 480 506 560 506" fill="none" stroke="#8a4f9e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="560.0" y="476.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">誰かに語る場面で</text>
<rect x="560.0" y="482.0" width="420.0" height="50.0" rx="10" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
<text x="770.0" y="514.0" fill="#8a4f9e" font-size="17" text-anchor="middle" font-weight="700">教訓を伝える材料</text>
<text x="50.0" y="572.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">出来事が書き換わるのではない。文脈と他の記憶との関係の中で再構成される。</text>
</g>
</svg>
