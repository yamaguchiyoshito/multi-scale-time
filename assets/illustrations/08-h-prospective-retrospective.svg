<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">体験中の時間と、振り返りの時間</title>
<desc id="desc">没頭と退屈で評価が逆転する。二つの評価は別の仕組みで決まる</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="560" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     08     図8-8</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">体験中の時間と、振り返りの時間</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">没頭と退屈で評価が逆転する。二つの評価は別の仕組みで決まる</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="520.0" y="250.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">体験中</text>
<text x="520.0" y="272.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">注意が時間に向くほど長い</text>
<text x="880.0" y="250.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="700">振り返り</text>
<text x="880.0" y="272.0" fill="#5d6873" font-size="12" text-anchor="middle" font-weight="400">記憶の密度が高いほど長い</text>
<text x="100.0" y="348.0" fill="#232a33" font-size="17" text-anchor="start" font-weight="700">没頭した活動</text>
<rect x="360.0" y="320.0" width="96.0" height="44.0" rx="8" fill="#2f8f83" stroke="none" stroke-width="0" opacity="0.8"/>
<text x="468.0" y="349.0" fill="#2f8f83" font-size="15" text-anchor="start" font-weight="700">短い</text>
<rect x="720.0" y="320.0" width="288.0" height="44.0" rx="8" fill="#2f8f83" stroke="none" stroke-width="0" opacity="0.8"/>
<text x="1020.0" y="349.0" fill="#2f8f83" font-size="15" text-anchor="start" font-weight="700">長い</text>
<text x="100.0" y="458.0" fill="#232a33" font-size="17" text-anchor="start" font-weight="700">退屈な待ち時間</text>
<rect x="360.0" y="430.0" width="288.0" height="44.0" rx="8" fill="#c7792b" stroke="none" stroke-width="0" opacity="0.8"/>
<text x="660.0" y="459.0" fill="#c7792b" font-size="15" text-anchor="start" font-weight="700">長い</text>
<rect x="720.0" y="430.0" width="96.0" height="44.0" rx="8" fill="#c7792b" stroke="none" stroke-width="0" opacity="0.8"/>
<text x="828.0" y="459.0" fill="#c7792b" font-size="15" text-anchor="start" font-weight="700">短い</text>
<line x1="350.0" y1="300.0" x2="350.0" y2="500.0" stroke="#d8d4c8" stroke-width="1"/>
<line x1="710.0" y1="300.0" x2="710.0" y2="500.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="50.0" y="532.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">主観的な時間の伸縮は、単一の内部時計の速さの変化だけでは説明できない。</text>
</g>
</svg>
