<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">いつもの部屋に入るとき</title>
<desc id="desc">脳は入る前から机・窓・照明の配置を予測している。ずれた部分だけが修正を要する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     03     図3-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">いつもの部屋に入るとき</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">脳は入る前から机・窓・照明の配置を予測している。ずれた部分だけが修正を要する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="140.0" y="210.0" width="700.0" height="340.0" rx="6" fill="#ffffff" stroke="#232a33" stroke-width="2.5"/>
<rect x="240.0" y="230.0" width="160.0" height="24.0" rx="12" fill="none" stroke="#2b5f9e" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="243.0" y="233.0" width="154.0" height="18.0" rx="12" fill="#ece9e0" stroke="#2b5f9e" stroke-width="1.5"/>
<text x="320.0" y="280.0" fill="#2b5f9e" font-size="13" text-anchor="middle" font-weight="400">窓</text>
<rect x="560.0" y="330.0" width="200.0" height="90.0" rx="12" fill="none" stroke="#2b5f9e" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="563.0" y="333.0" width="194.0" height="84.0" rx="4" fill="#ece9e0" stroke="#2b5f9e" stroke-width="1.5"/>
<text x="660.0" y="380.0" fill="#2b5f9e" font-size="14" text-anchor="middle" font-weight="400">机</text>
<circle cx="480.0" cy="240.0" r="18" fill="none" stroke="#2b5f9e" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="480.0" cy="240.0" r="14" fill="#f3d16a"/>
<text x="480.0" y="282.0" fill="#2b5f9e" font-size="13" text-anchor="middle" font-weight="400">照明</text>
<rect x="300.0" y="440.0" width="60.0" height="60.0" rx="12" fill="none" stroke="#c7792b" stroke-width="2" stroke-dasharray="8 7"/>
<text x="330.0" y="526.0" fill="#c7792b" font-size="12" text-anchor="middle" font-weight="400">予測した椅子</text>
<rect x="420.0" y="460.0" width="60.0" height="60.0" rx="4" fill="#ece9e0" stroke="#c7792b" stroke-width="2"/>
<text x="450.0" y="540.0" fill="#c7792b" font-size="12" text-anchor="middle" font-weight="400">実際の椅子</text>
<line x1="365.0" y1="470.0" x2="415.0" y2="490.0" stroke="#c7792b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
<text x="880.0" y="260.0" fill="#2b5f9e" font-size="14" text-anchor="start" font-weight="700">破線：入る前の予測</text>
<text x="880.0" y="286.0" fill="#232a33" font-size="14" text-anchor="start" font-weight="700">実線：実際の入力</text>
<text x="880.0" y="340.0" fill="#2b5f9e" font-size="14" text-anchor="start" font-weight="400">窓・机・照明：一致</text>
<text x="880.0" y="366.0" fill="#5d6873" font-size="13" text-anchor="start" font-weight="400">→ 推定を維持</text>
<text x="880.0" y="420.0" fill="#c7792b" font-size="14" text-anchor="start" font-weight="700">椅子：ずれ</text>
<text x="880.0" y="446.0" fill="#5d6873" font-size="13" text-anchor="start" font-weight="400">→ 予測誤差で修正</text>
<text x="50.0" y="572.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">毎回初めて見るものとして解析しているのではない。学習した世界の構造を使って認識が成立する。</text>
</g>
</svg>
