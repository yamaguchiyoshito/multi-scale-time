<rect x="600.0" y="196.0" width="60.0" height="340.0" rx="8" fill="#c7792b" stroke="none" stroke-width="0" opacity="0.14"/>
<text x="630.0" y="190.0" fill="#c7792b" font-size="20" text-anchor="middle" font-weight="700">いま</text>
<text x="840.0" y="262.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400">一つの身体の中で、</text>
<text x="840.0" y="296.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400">異なる速さの過程が</text>
<text x="840.0" y="330.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400">同時に進んでいる。</text>
<text x="840.0" y="364.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400"></text>
<text x="840.0" y="398.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400">それらが重なり合うところに、</text>
<text x="840.0" y="432.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400">私たちが「いま」と呼ぶ</text>
<text x="840.0" y="466.0" fill="#232a33" font-size="22" text-anchor="start" font-weight="400">経験がある。</text>
<text x="600.0" y="592.0" fill="#2b5f9e" font-size="30" text-anchor="middle" font-weight="700">私たちの中には、複数の時間が流れている。</text>
<text x="50.0" y="632.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">時間の流れは知覚されるのではなく、生物の情報処理によって経験として構成される。</text>
