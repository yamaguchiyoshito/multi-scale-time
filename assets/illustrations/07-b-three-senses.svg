<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">身体は、脳に何を伝えているのか</title>
<desc id="desc">坂道を走る場面。外受容・自己受容・内受容の三つの流れが脳へ集まり、行動の調整として返される</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="640" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     07     図7-2</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">身体は、脳に何を伝えているのか</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">坂道を走る場面。外受容・自己受容・内受容の三つの流れが脳へ集まり、行動の調整として返される</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<path d="M 120 560 L 720 400" fill="none" stroke="#5d6873" stroke-width="3"/>
<path d="M 120 560 L 720 560 L 720 400 Z" fill="#ece9e0" stroke="none" stroke-width="0"/>
<circle cx="475.6" cy="348.8" r="15.399999999999999" fill="#232a33"/>
<line x1="474.5" y1="365.6" x2="470.0" y2="430.0" stroke="#232a33" stroke-width="5.6"/>
<line x1="470.0" y1="430.0" x2="439.2" y2="480.4" stroke="#232a33" stroke-width="5.6"/>
<line x1="470.0" y1="430.0" x2="503.6" y2="472.0" stroke="#232a33" stroke-width="5.6"/>
<line x1="475.6" y1="379.6" x2="439.2" y2="402.0" stroke="#232a33" stroke-width="4.8999999999999995"/>
<line x1="475.6" y1="379.6" x2="506.4" y2="368.4" stroke="#232a33" stroke-width="4.8999999999999995"/>
<rect x="470.0" y="206.0" width="260.0" height="70.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="600.0" y="237.0" fill="#2b5f9e" font-size="22" text-anchor="middle" font-weight="700">脳</text>
<text x="600.0" y="267.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">内部モデルで統合・推定</text>
<text x="220.0" y="300.0" fill="#2f8f83" font-size="17" text-anchor="middle" font-weight="700">外受容感覚</text>
<text x="220.0" y="322.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">傾斜・障害物</text>
<path d="M 250 332 C 300 360 360 300 465 250" fill="none" stroke="#2f8f83" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<circle cx="170.0" cy="440.0" r="10" fill="#2f8f83"/>
<text x="170.0" y="470.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">視覚</text>
<path d="M 185 436 C 220 400 230 360 220 334" fill="none" stroke="#2f8f83" stroke-width="1.5" stroke-dasharray="8 7"/>
<text x="300.0" y="470.0" fill="#c7792b" font-size="17" text-anchor="middle" font-weight="700">自己受容感覚</text>
<text x="300.0" y="492.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">脚の動き・姿勢</text>
<path d="M 350 458 C 400 400 430 330 475 284" fill="none" stroke="#c7792b" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
<text x="880.0" y="300.0" fill="#8a4f9e" font-size="17" text-anchor="middle" font-weight="700">内受容感覚</text>
<text x="880.0" y="322.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">心拍・呼吸・疲労</text>
<path d="M 850 332 C 800 360 760 300 735 250" fill="none" stroke="#8a4f9e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="880.0" y="370.0" fill="#8a4f9e" font-size="24" text-anchor="middle" font-weight="400">♥</text>
<path d="M 735 230 C 900 230 980 380 900 520" fill="none" stroke="#2b5f9e" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
<text x="1010.0" y="440.0" fill="#2b5f9e" font-size="16" text-anchor="middle" font-weight="700">走る速さの調整</text>
<text x="1010.0" y="462.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">行動として身体へ返す</text>
<text x="50.0" y="612.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">身体の状態は付随情報ではなく、注意・判断・行動を変える入力である。</text>
</g>
</svg>
