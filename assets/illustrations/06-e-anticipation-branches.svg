<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">予感が、現在を変える</title>
<desc id="desc">「今日は大切な話がある」と聞いた瞬間から、まだ言われていない内容への予感が現在の経験に入り込む</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker><radialGradient id="g06e-1"><stop offset="0" stop-color="#c7792b" stop-opacity="0.45"/><stop offset="0.55" stop-color="#c7792b" stop-opacity="0.20"/><stop offset="1" stop-color="#c7792b" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="610" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     06     図6-5</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">予感が、現在を変える</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">「今日は大切な話がある」と聞いた瞬間から、まだ言われていない内容への予感が現在の経験に入り込む</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<line x1="120.0" y1="480.0" x2="1080.0" y2="480.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1086.0" y="485.0" fill="#5d6873" font-size="13" text-anchor="start" font-weight="400">時間</text>
<circle cx="400.0" cy="480.0" r="10" fill="#232a33"/>
<text x="400.0" y="516.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">「今日は大切な話がある」</text>
<text x="400.0" y="540.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">いま</text>
<path d="M 408 472 C 600 472 700 270 860 270" fill="none" stroke="#2f8f83" stroke-width="2" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<text x="880.0" y="275.0" fill="#2f8f83" font-size="15" text-anchor="start" font-weight="700">良い知らせかもしれない</text>
<path d="M 408 472 C 600 472 700 350 860 350" fill="none" stroke="#c7792b" stroke-width="2" marker-end="url(#arrow-amber)" stroke-dasharray="8 7"/>
<text x="880.0" y="355.0" fill="#c7792b" font-size="15" text-anchor="start" font-weight="700">悪い知らせかもしれない</text>
<path d="M 408 472 C 600 472 700 430 860 430" fill="none" stroke="#8a4f9e" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="880.0" y="435.0" fill="#8a4f9e" font-size="15" text-anchor="start" font-weight="700">相談かもしれない</text>
<text x="960.0" y="240.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">まだ言われていない内容</text>
<circle cx="400.0" cy="400.0" r="80" fill="url(#g06e-1)"/>
<text x="400.0" y="396.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">期待</text>
<text x="400.0" y="416.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">不安</text>
<text x="220.0" y="400.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">現在の経験に</text>
<text x="220.0" y="420.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">生じるもの</text>
<text x="50.0" y="582.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">未来の可能性が、実現する前に現在の一部になっている。</text>
</g>
</svg>
