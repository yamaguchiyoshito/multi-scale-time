<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">予測誤差が、推定を修正する</title>
<desc id="desc">遠くの赤いものを「バラ」と予測し、近づいて入力が変わると「造花」へ改める</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker><radialGradient id="g03d-1"><stop offset="0" stop-color="#c23b3b" stop-opacity="0.9"/><stop offset="0.55" stop-color="#c23b3b" stop-opacity="0.41"/><stop offset="1" stop-color="#c23b3b" stop-opacity="0"/></radialGradient><radialGradient id="g03d-2"><stop offset="0" stop-color="#c23b3b" stop-opacity="0.9"/><stop offset="0.55" stop-color="#c23b3b" stop-opacity="0.41"/><stop offset="1" stop-color="#c23b3b" stop-opacity="0"/></radialGradient><radialGradient id="g03d-3"><stop offset="0" stop-color="#c23b3b" stop-opacity="0.9"/><stop offset="0.55" stop-color="#c23b3b" stop-opacity="0.41"/><stop offset="1" stop-color="#c23b3b" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="580" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     03     図3-4</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">予測誤差が、推定を修正する</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">遠くの赤いものを「バラ」と予測し、近づいて入力が変わると「造花」へ改める</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="200.0" width="330.0" height="300.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="235.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">遠くで</text>
<rect x="430.0" y="200.0" width="330.0" height="300.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="595.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">近づく</text>
<rect x="790.0" y="200.0" width="330.0" height="300.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="955.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">推定の修正</text>
<circle cx="235.0" cy="330.0" r="26" fill="url(#g03d-1)"/>
<rect x="130.0" y="400.0" width="210.0" height="56.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="235.0" y="436.0" fill="#2b5f9e" font-size="18" text-anchor="middle" font-weight="700">予測：バラ</text>
<text x="235.0" y="480.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">入力は小さく曖昧</text>
<circle cx="595.0" cy="320.0" r="60" fill="url(#g03d-2)"/>
<line x1="560.0" y1="300.0" x2="568.0" y2="345.0" stroke="#ffffff" stroke-width="1.2"/>
<line x1="578.0" y1="300.0" x2="586.0" y2="345.0" stroke="#ffffff" stroke-width="1.2"/>
<line x1="596.0" y1="300.0" x2="604.0" y2="345.0" stroke="#ffffff" stroke-width="1.2"/>
<line x1="614.0" y1="300.0" x2="622.0" y2="345.0" stroke="#ffffff" stroke-width="1.2"/>
<line x1="632.0" y1="300.0" x2="640.0" y2="345.0" stroke="#ffffff" stroke-width="1.2"/>
<text x="595.0" y="384.0" fill="#c7792b" font-size="15" text-anchor="middle" font-weight="700">入力：布の質感</text>
<rect x="490.0" y="400.0" width="210.0" height="56.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="595.0" y="436.0" fill="#2b5f9e" font-size="18" text-anchor="middle" font-weight="700">予測：バラ</text>
<text x="595.0" y="480.0" fill="#c7792b" font-size="14" text-anchor="middle" font-weight="700">予測と入力に差 ＝ 予測誤差</text>
<circle cx="955.0" cy="320.0" r="60" fill="url(#g03d-3)"/>
<rect x="850.0" y="400.0" width="210.0" height="56.0" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="955.0" y="436.0" fill="#2f8f83" font-size="18" text-anchor="middle" font-weight="700">推定：造花</text>
<text x="955.0" y="480.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="400">誤差で内部モデルを更新</text>
<line x1="405.0" y1="428.0" x2="440.0" y2="428.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="765.0" y1="428.0" x2="800.0" y2="428.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50.0" y="552.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">誤差は認識の失敗ではなく、モデルを更新するための情報である。</text>
</g>
</svg>
