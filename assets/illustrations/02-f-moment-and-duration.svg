<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">瞬間と持続</title>
<desc id="desc">瞬間は弁別できる最小の幅、持続は複数の出来事を一つの流れとして経験すること</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker><radialGradient id="g02f-1"><stop offset="0" stop-color="#2f8f83" stop-opacity="0.35"/><stop offset="0.55" stop-color="#2f8f83" stop-opacity="0.16"/><stop offset="1" stop-color="#2f8f83" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="560" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     02     図2-6</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">瞬間と持続</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">瞬間は弁別できる最小の幅、持続は複数の出来事を一つの流れとして経験すること</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="200.0" width="500.0" height="300.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="320.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">瞬間</text>
<text x="110.0" y="268.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">間隔が長い</text>
<circle cx="300.0" cy="262.0" r="12" fill="#c7792b"/>
<circle cx="440.0" cy="262.0" r="12" fill="#c7792b"/>
<text x="520.0" y="268.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">二つの出来事</text>
<text x="110.0" y="338.0" fill="#5d6873" font-size="15" text-anchor="start" font-weight="400">間隔が短い</text>
<circle cx="360.0" cy="332.0" r="12" fill="#c7792b"/>
<circle cx="390.0" cy="332.0" r="12" fill="#c7792b"/>
<text x="520.0" y="338.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">一つに見える</text>
<path d="M 346.0 346.0 Q 346.0 356.0 358.0 356.0 L 363.0 356.0 Q 375.0 356.0 375.0 366.0 Q 375.0 356.0 387.0 356.0 L 392.0 356.0 Q 404.0 356.0 404.0 346.0" fill="none" stroke="#5d6873" stroke-width="1.6"/>
<text x="375.0" y="392.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">弁別できる最小の幅</text>
<text x="320.0" y="432.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">弁別できる最小の幅 ＝ その個体の「瞬間」</text>
<text x="320.0" y="470.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">物理的には二つ。知覚の上では一つ。</text>
<rect x="630.0" y="200.0" width="500.0" height="300.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="880.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">持続</text>
