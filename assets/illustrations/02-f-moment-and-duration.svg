<path d="M 710 372 Q 740.0 290 770 332" fill="none" stroke="#2f8f83" stroke-width="1.6" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<circle cx="780.0" cy="340.0" r="11" fill="#2f8f83"/>
<line x1="780.0" y1="340.0" x2="780.0" y2="304.0" stroke="#2f8f83" stroke-width="2.5"/>
<path d="M 790 332 Q 820.0 290 850 352" fill="none" stroke="#2f8f83" stroke-width="1.6" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<circle cx="860.0" cy="360.0" r="11" fill="#2f8f83"/>
<line x1="860.0" y1="360.0" x2="860.0" y2="324.0" stroke="#2f8f83" stroke-width="2.5"/>
<path d="M 870 352 Q 900.0 270 930 312" fill="none" stroke="#2f8f83" stroke-width="1.6" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<circle cx="940.0" cy="320.0" r="11" fill="#2f8f83"/>
<line x1="940.0" y1="320.0" x2="940.0" y2="284.0" stroke="#2f8f83" stroke-width="2.5"/>
<path d="M 950 312 Q 980.0 270 1010 337" fill="none" stroke="#2f8f83" stroke-width="1.6" marker-end="url(#arrow-teal)" stroke-dasharray="8 7"/>
<circle cx="1020.0" cy="345.0" r="11" fill="#2f8f83"/>
<line x1="1020.0" y1="345.0" x2="1020.0" y2="309.0" stroke="#2f8f83" stroke-width="2.5"/>
<text x="880.0" y="440.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">前の音が次の音へ残り、意味を変え合う</text>
<text x="880.0" y="470.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">音の集合ではなく、一つのメロディーとして経験される</text>
</g>
</svg>
