<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">一つの出来事に、三つの時間スケールが応答する</title>
<desc id="desc">反射、経験による修正、将来を見越した計画は、同じ身体の中で並行して成立する</desc>
<defs><marker id="arrow-5d6873" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="580" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     04     図4-5</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">一つの出来事に、三つの時間スケールが応答する</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">反射、経験による修正、将来を見越した計画は、同じ身体の中で並行して成立する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<circle cx="150.0" cy="386.0" r="16" fill="#c7792b"/>
<text x="150.0" y="428.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">熱い鍋に</text>
<text x="150.0" y="448.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">触れる</text>
<line x1="200.0" y1="250.0" x2="200.0" y2="500.0" stroke="#d8d4c8" stroke-width="1" stroke-dasharray="8 7"/>
<rect x="200.0" y="282.0" width="120.0" height="28.0" rx="14" fill="#c7792b" stroke="none" stroke-width="0" opacity="0.8"/>
<text x="326.0" y="302.0" fill="#c7792b" font-size="15" text-anchor="start" font-weight="700">一瞬</text>
<text x="206.0" y="272.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">反射：手を引く</text>
<rect x="200.0" y="372.0" width="420.0" height="28.0" rx="14" fill="#2f8f83" stroke="none" stroke-width="0" opacity="0.8"/>
<text x="626.0" y="392.0" fill="#2f8f83" font-size="15" text-anchor="start" font-weight="700">次の機会</text>
<text x="206.0" y="362.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">修正：次から鍋つかみを使う</text>
<rect x="200.0" y="462.0" width="820.0" height="28.0" rx="14" fill="#2b5f9e" stroke="none" stroke-width="0" opacity="0.8"/>
<text x="1026.0" y="482.0" fill="#2b5f9e" font-size="15" text-anchor="start" font-weight="700">数日〜数週間</text>
<text x="206.0" y="452.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="400">計画：配置と手順を見直す</text>
<line x1="200.0" y1="500.0" x2="1080.0" y2="500.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow-5d6873)"/>
<line x1="200.0" y1="494.0" x2="200.0" y2="506.0" stroke="#5d6873" stroke-width="1.5"/>
<text x="200.0" y="528.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">0</text>
<line x1="320.0" y1="494.0" x2="320.0" y2="506.0" stroke="#5d6873" stroke-width="1.5"/>
<text x="320.0" y="528.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">秒</text>
<line x1="620.0" y1="494.0" x2="620.0" y2="506.0" stroke="#5d6873" stroke-width="1.5"/>
<text x="620.0" y="528.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">分〜時間</text>
<line x1="1020.0" y1="494.0" x2="1020.0" y2="506.0" stroke="#5d6873" stroke-width="1.5"/>
<text x="1020.0" y="528.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">日〜週</text>
<text x="80.0" y="236.0" fill="#232a33" font-size="16" text-anchor="start" font-weight="700">同じ身体の中で並行して応答する</text>
<text x="50.0" y="552.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">進化が拡張したのは反応の遅さではなく、異なる時間スケールで情報を扱い行動を選ぶ能力である。</text>
</g>
</svg>
