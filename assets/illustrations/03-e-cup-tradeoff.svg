<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="578" viewBox="0 0 1200 578" role="img" aria-labelledby="title desc">
<title id="title">行動に要る情報と、要らない情報</title>
<desc id="desc">コップを持ち上げるのに、表面の傷や反射をすべて解析する必要はない</desc>
<defs><marker id="arrow-2f8f83" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker><marker id="arrow-5d6873" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="578" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     03     図3-5</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">行動に要る情報と、要らない情報</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">コップを持ち上げるのに、表面の傷や反射をすべて解析する必要はない</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<path d="M 520 260 L 540 440 Q 600 460 660 440 L 680 260 Z" fill="#ffffff" stroke="#232a33" stroke-width="2.5"/>
<path d="M 680 300 Q 740 320 680 390" fill="none" stroke="#232a33" stroke-width="2.5"/>
<text x="140.0" y="290.0" fill="#2f8f83" font-size="17" text-anchor="start" font-weight="700">要る情報</text>
<text x="140.0" y="320.0" fill="#2f8f83" font-size="17" text-anchor="start" font-weight="700">位置</text>
<text x="140.0" y="350.0" fill="#2f8f83" font-size="17" text-anchor="start" font-weight="700">大きさ</text>
<text x="140.0" y="380.0" fill="#2f8f83" font-size="17" text-anchor="start" font-weight="700">持ちやすさ</text>
<line x1="260.0" y1="310.0" x2="510.0" y2="300.0" stroke="#2f8f83" stroke-width="1.5" marker-end="url(#arrow-2f8f83)"/>
<line x1="260.0" y1="340.0" x2="510.0" y2="345.0" stroke="#2f8f83" stroke-width="1.5" marker-end="url(#arrow-2f8f83)"/>
<line x1="260.0" y1="370.0" x2="510.0" y2="390.0" stroke="#2f8f83" stroke-width="1.5" marker-end="url(#arrow-2f8f83)"/>
<text x="840.0" y="290.0" fill="#5d6873" font-size="17" text-anchor="start" font-weight="700">要らない情報</text>
<text x="840.0" y="320.0" fill="#5d6873" font-size="17" text-anchor="start" font-weight="700">微細な傷</text>
<text x="840.0" y="350.0" fill="#5d6873" font-size="17" text-anchor="start" font-weight="700">光の反射のすべて</text>
<line x1="830.0" y1="340.0" x2="600.0" y2="330.0" stroke="#5d6873" stroke-width="1.5" marker-end="url(#arrow-5d6873)" stroke-dasharray="8 7"/>
<line x1="830.0" y1="370.0" x2="640.0" y2="400.0" stroke="#5d6873" stroke-width="1.5" marker-end="url(#arrow-5d6873)" stroke-dasharray="8 7"/>
<line x1="200.0" y1="520.0" x2="1000.0" y2="520.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow-5d6873)"/>
<text x="200.0" y="548.0" fill="#232a33" font-size="15" text-anchor="start" font-weight="400">速く行動する</text>
<text x="1000.0" y="548.0" fill="#232a33" font-size="15" text-anchor="end" font-weight="400">精度を上げる（時間とエネルギーが要る）</text>
<circle cx="430.0" cy="520.0" r="9" fill="#2f8f83"/>
<text x="430.0" y="500.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">行動に必要な精度</text>
</g>
</svg>
