<line x1="330.0" y1="196.0" x2="330.0" y2="540.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="50.0" y="632.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">同一の測定方法による比較値ではなく、感覚・課題ごとの代表例である。</text>
