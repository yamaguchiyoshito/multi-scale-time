<rect x="641.6" y="336.0" width="373.1" height="30.0" rx="15.0" fill="#8a4f9e" stroke="none" stroke-width="0" opacity="0.78"/>
<text x="627.6" y="357.0" fill="#232a33" font-size="17" text-anchor="end" font-weight="400">免疫系</text>
<text x="653.6" y="356.0" fill="#ffffff" font-size="13" text-anchor="start" font-weight="400">防御・炎症・免疫記憶</text>
<rect x="330.0" y="396.0" width="517.6" height="30.0" rx="15.0" fill="#2f8f83" stroke="none" stroke-width="0" opacity="0.78"/>
