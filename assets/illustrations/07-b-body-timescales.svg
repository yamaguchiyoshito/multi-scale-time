<text x="342.0" y="416.0" fill="#ffffff" font-size="13" text-anchor="start" font-weight="400">エネルギーの生成と利用</text>
<rect x="847.6" y="456.0" width="232.4" height="30.0" rx="15.0" fill="#5d6873" stroke="none" stroke-width="0" opacity="0.78"/>
<text x="833.6" y="477.0" fill="#232a33" font-size="17" text-anchor="end" font-weight="400">成長・発達</text>
<text x="859.6" y="476.0" fill="#232a33" font-size="13" text-anchor="start" font-weight="400">身体構造と機能の変化</text>
<line x1="330.0" y1="200.0" x2="330.0" y2="546.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="50.0" y="632.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">帯は重なり合い、同じ身体の中で同時に進行している。範囲は単純化した代表例。</text>
