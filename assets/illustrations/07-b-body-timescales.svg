<text x="757.6" y="584.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">1時間</text>
<line x1="847.6" y1="550.0" x2="847.6" y2="562.0" stroke="#5d6873" stroke-width="1.5"/>
