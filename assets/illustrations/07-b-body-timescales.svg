<line x1="1080.0" y1="550.0" x2="1080.0" y2="562.0" stroke="#5d6873" stroke-width="1.5"/>
<text x="1080.0" y="584.0" fill="#5d6873" font-size="16" text-anchor="middle" font-weight="400">10年</text>
