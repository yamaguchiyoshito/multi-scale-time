<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">時計が測る30分と、経験される30分</title>
<desc id="desc">目盛りは同じでも、経験される長さは場面によって伸び縮みする</desc>
<defs></defs>
<rect width="1200" height="560" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     01     図1-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">時計が測る30分と、経験される30分</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">目盛りは同じでも、経験される長さは場面によって伸び縮みする</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<text x="80.0" y="258.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="700">時計の30分</text>
<line x1="300.0" y1="252.0" x2="1060.0" y2="252.0" stroke="#232a33" stroke-width="2.5"/>
<line x1="300.0" y1="242.0" x2="300.0" y2="262.0" stroke="#232a33" stroke-width="2"/>
<text x="300.0" y="286.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">0分</text>
<line x1="426.7" y1="242.0" x2="426.7" y2="262.0" stroke="#232a33" stroke-width="2"/>
<text x="426.7" y="286.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">5分</text>
<line x1="553.3" y1="242.0" x2="553.3" y2="262.0" stroke="#232a33" stroke-width="2"/>
<text x="553.3" y="286.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">10分</text>
<line x1="680.0" y1="242.0" x2="680.0" y2="262.0" stroke="#232a33" stroke-width="2"/>
<text x="680.0" y="286.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">15分</text>
<line x1="806.7" y1="242.0" x2="806.7" y2="262.0" stroke="#232a33" stroke-width="2"/>
<text x="806.7" y="286.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">20分</text>
<line x1="933.3" y1="242.0" x2="933.3" y2="262.0" stroke="#232a33" stroke-width="2"/>
<text x="933.3" y="286.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">25分</text>
<line x1="1060.0" y1="242.0" x2="1060.0" y2="262.0" stroke="#232a33" stroke-width="2"/>
<text x="1060.0" y="286.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">30分</text>
<text x="80.0" y="372.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="700">退屈な会議</text>
<text x="80.0" y="394.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">長く感じる</text>
<rect x="300.0" y="350.0" width="840.0" height="36.0" rx="18" fill="#c7792b" stroke="none" stroke-width="0" opacity="0.8"/>
<text x="80.0" y="462.0" fill="#232a33" font-size="19" text-anchor="start" font-weight="700">友人と過ごす</text>
<text x="80.0" y="484.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">一瞬で終わる</text>
<rect x="300.0" y="440.0" width="300.0" height="36.0" rx="18" fill="#2f8f83" stroke="none" stroke-width="0" opacity="0.8"/>
<line x1="300.0" y1="300.0" x2="300.0" y2="500.0" stroke="#d8d4c8" stroke-width="1" stroke-dasharray="8 7"/>
<line x1="1060.0" y1="300.0" x2="1060.0" y2="500.0" stroke="#d8d4c8" stroke-width="1" stroke-dasharray="8 7"/>
<text x="1060.0" y="520.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">時計の上では同じ終点</text>
<path d="M 300.0 388.0 Q 300.0 398.0 312.0 398.0 L 708.0 398.0 Q 720.0 398.0 720.0 408.0 Q 720.0 398.0 732.0 398.0 L 1128.0 398.0 Q 1140.0 398.0 1140.0 388.0" fill="none" stroke="#5d6873" stroke-width="1.6"/>
<text x="720.0" y="424.0" fill="#c7792b" font-size="14" text-anchor="middle" font-weight="400">経験された長さ</text>
<path d="M 300.0 478.0 Q 300.0 488.0 312.0 488.0 L 438.0 488.0 Q 450.0 488.0 450.0 498.0 Q 450.0 488.0 462.0 488.0 L 588.0 488.0 Q 600.0 488.0 600.0 478.0" fill="none" stroke="#5d6873" stroke-width="1.6"/>
<text x="450.0" y="514.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="400">経験された長さ</text>
<text x="50.0" y="532.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">時計が間違っているのでも、感覚が不正確なのでもない。測っているものが異なる。</text>
</g>
</svg>
