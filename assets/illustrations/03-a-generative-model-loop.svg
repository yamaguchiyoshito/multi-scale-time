<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">知覚は、予測と修正の往復で成立する</title>
<desc id="desc">感覚入力と生成モデルの予測が照合され、その差が内部モデルを更新する</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="580" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     03     図3-1</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">知覚は、予測と修正の往復で成立する</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">感覚入力と生成モデルの予測が照合され、その差が内部モデルを更新する</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="80.0" y="420.0" width="240.0" height="90.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="200.0" y="461.0" fill="#5d6873" font-size="22" text-anchor="middle" font-weight="700">外界</text>
<text x="200.0" y="491.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">赤いバラから届く光</text>
<rect x="430.0" y="420.0" width="300.0" height="90.0" rx="14" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="580.0" y="461.0" fill="#c7792b" font-size="22" text-anchor="middle" font-weight="700">照合</text>
<text x="580.0" y="491.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">予測と入力の差 ＝ 予測誤差</text>
<rect x="430.0" y="212.0" width="300.0" height="90.0" rx="14" fill="#ffffff" stroke="#2b5f9e" stroke-width="2"/>
<text x="580.0" y="253.0" fill="#2b5f9e" font-size="20" text-anchor="middle" font-weight="700">生成モデル（内部モデル）</text>
<text x="580.0" y="283.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">過去の経験から形成</text>
<rect x="860.0" y="316.0" width="270.0" height="90.0" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="995.0" y="357.0" fill="#2f8f83" font-size="22" text-anchor="middle" font-weight="700">知覚</text>
<text x="995.0" y="387.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">「赤いバラ」として見える</text>
<line x1="325.0" y1="465.0" x2="425.0" y2="465.0" stroke="#5d6873" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="375.0" y="452.0" fill="#5d6873" font-size="15" text-anchor="middle" font-weight="400">感覚入力</text>
<line x1="520.0" y1="306.0" x2="520.0" y2="416.0" stroke="#2b5f9e" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
<text x="505.0" y="366.0" fill="#2b5f9e" font-size="16" text-anchor="end" font-weight="700">予測</text>
<line x1="640.0" y1="416.0" x2="640.0" y2="306.0" stroke="#c7792b" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
<text x="655.0" y="366.0" fill="#c7792b" font-size="16" text-anchor="start" font-weight="700">予測誤差 → 更新</text>
<path d="M 735 257 C 800 257 820 300 855 345" fill="none" stroke="#2f8f83" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<text x="760.0" y="232.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">推定された対象</text>
<text x="600.0" y="548.0" fill="#232a33" font-size="17" text-anchor="middle" font-weight="400">入力を待って処理するだけではない。すでに持つモデルで入力を解釈している。</text>
</g>
</svg>
