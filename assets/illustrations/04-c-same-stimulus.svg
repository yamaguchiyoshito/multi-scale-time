<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">同じ刺激、異なる行動</title>
<desc id="desc">内部状態と過去の経験が、刺激と反応の間に入る</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="610" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     04     図4-3</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">同じ刺激、異なる行動</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">内部状態と過去の経験が、刺激と反応の間に入る</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="480.0" y="350.0" width="240.0" height="80.0" rx="14" fill="#ffffff" stroke="#5d6873" stroke-width="2"/>
<text x="600.0" y="386.0" fill="#5d6873" font-size="20" text-anchor="middle" font-weight="700">目の前の食べ物</text>
<text x="600.0" y="416.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">同じ感覚刺激</text>
<rect x="90.0" y="270.0" width="300.0" height="56.0" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="240.0" y="304.0" fill="#2f8f83" font-size="16" text-anchor="middle" font-weight="700">空腹である</text>
<path d="M 395 298 C 440 298 440 390 475 390" fill="none" stroke="#2f8f83" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
<rect x="820.0" y="270.0" width="280.0" height="56.0" rx="10" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="960.0" y="304.0" fill="#2f8f83" font-size="18" text-anchor="middle" font-weight="700">近づく</text>
<path d="M 725 390 C 760 390 760 298 815 298" fill="none" stroke="#2f8f83" stroke-width="1.8" marker-end="url(#arrow-teal)"/>
<rect x="90.0" y="370.0" width="300.0" height="56.0" rx="10" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="240.0" y="404.0" fill="#c7792b" font-size="16" text-anchor="middle" font-weight="700">以前に食べて体調を崩した</text>
<path d="M 395 398 C 440 398 440 390 475 390" fill="none" stroke="#c7792b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
<rect x="820.0" y="370.0" width="280.0" height="56.0" rx="10" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<text x="960.0" y="404.0" fill="#c7792b" font-size="18" text-anchor="middle" font-weight="700">避ける</text>
<path d="M 725 390 C 760 390 760 398 815 398" fill="none" stroke="#c7792b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
<rect x="90.0" y="470.0" width="300.0" height="56.0" rx="10" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
<text x="240.0" y="504.0" fill="#8a4f9e" font-size="16" text-anchor="middle" font-weight="700">周囲に捕食者がいる</text>
<path d="M 395 498 C 440 498 440 390 475 390" fill="none" stroke="#8a4f9e" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.0" y="470.0" width="280.0" height="56.0" rx="10" fill="#ffffff" stroke="#8a4f9e" stroke-width="2"/>
<text x="960.0" y="504.0" fill="#8a4f9e" font-size="18" text-anchor="middle" font-weight="700">逃げる</text>
<path d="M 725 390 C 760 390 760 498 815 498" fill="none" stroke="#8a4f9e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="240.0" y="240.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">内部状態・過去の経験</text>
<text x="960.0" y="240.0" fill="#232a33" font-size="15" text-anchor="middle" font-weight="700">行動</text>
<text x="50.0" y="582.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">刺激と反応は一対一ではない。複数の可能性を評価する仕組みに、時間的な内部が要る。</text>
</g>
</svg>
