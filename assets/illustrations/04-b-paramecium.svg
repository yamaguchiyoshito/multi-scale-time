<text x="1034.0" y="451.0" fill="#5d6873" font-size="17" text-anchor="middle" font-weight="400">進行方向を変える</text>
<text x="50.0" y="532.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">脳も神経系もない。それでも刺激を検出し、行動を変える。主観的経験があるかは、この反応だけからは判断できない。</text>
