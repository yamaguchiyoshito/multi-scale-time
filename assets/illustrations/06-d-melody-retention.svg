<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">「ミ」が鳴っている現在</title>
<desc id="desc">原初印象、保持、予感は並んでいるのではなく、一つの現在の中で結びついている</desc>
<defs><marker id="arrow-5d6873" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="560" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     06     図6-4</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">「ミ」が鳴っている現在</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">原初印象、保持、予感は並んでいるのではなく、一つの現在の中で結びついている</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<line x1="150.0" y1="360.0" x2="1080.0" y2="360.0" stroke="#5d6873" stroke-width="2" marker-end="url(#arrow-5d6873)"/>
<text x="1086.0" y="388.0" fill="#5d6873" font-size="14" text-anchor="start" font-weight="400">時間</text>
<circle cx="330.0" cy="330.0" r="22" fill="#2f8f83" opacity="0.45"/>
<text x="330.0" y="338.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">ド</text>
<text x="330.0" y="268.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">保持</text>
<text x="330.0" y="294.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">鳴り終わっても現在に残る</text>
<text x="330.0" y="400.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">鳴り終わった</text>
<circle cx="600.0" cy="330.0" r="22" fill="#2f8f83"/>
<text x="600.0" y="338.0" fill="#ffffff" font-size="20" text-anchor="middle" font-weight="700">ミ</text>
<text x="600.0" y="268.0" fill="#2f8f83" font-size="20" text-anchor="middle" font-weight="700">原初印象</text>
<text x="600.0" y="294.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">いま直接経験している</text>
<text x="600.0" y="400.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">鳴っている</text>
<circle cx="870.0" cy="330.0" r="22" fill="none" stroke="#2f8f83" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="870.0" y="338.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">ソ</text>
<text x="870.0" y="268.0" fill="#232a33" font-size="20" text-anchor="middle" font-weight="700">予感</text>
<text x="870.0" y="294.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">まだ鳴っていないが先取りされる</text>
<text x="870.0" y="400.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">次に鳴る</text>
<path d="M 356 322 C 440 250 520 250 578 318" fill="none" stroke="#5d6873" stroke-width="1.5" marker-end="url(#arrow-5d6873)" stroke-dasharray="8 7"/>
<path d="M 622 318 C 680 250 760 250 846 320" fill="none" stroke="#5d6873" stroke-width="1.5" marker-end="url(#arrow-5d6873)" stroke-dasharray="8 7"/>
<rect x="250.0" y="230.0" width="700.0" height="200.0" rx="100" fill="#2f8f83" stroke="none" stroke-width="0" opacity="0.08"/>
<path d="M 250.0 440.0 Q 250.0 450.0 262.0 450.0 L 588.0 450.0 Q 600.0 450.0 600.0 460.0 Q 600.0 450.0 612.0 450.0 L 938.0 450.0 Q 950.0 450.0 950.0 440.0" fill="none" stroke="#5d6873" stroke-width="1.6"/>
<text x="600.0" y="486.0" fill="#2f8f83" font-size="20" text-anchor="middle" font-weight="700">一つの現在</text>
<text x="50.0" y="532.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">だから三つの音は、独立した刺激ではなくメロディーとして経験される。</text>
</g>
</svg>
