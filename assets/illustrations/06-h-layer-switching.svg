<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">二つの時間階層の切り替え</title>
<desc id="desc">名前を思い出そうとして会話を止めるとき、処理資源を記憶探索へ回している</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5d6873" stroke-width="1.4"/></marker><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2b5f9e" stroke-width="1.4"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c7792b" stroke-width="1.4"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2f8f83" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#f7f5ef"/>
<g font-family='system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", Meiryo, sans-serif'>
<text x="50.0" y="52.0" fill="#2b5f9e" font-size="18" text-anchor="start" font-weight="700">MULTI-SCALE TIME     06     図6-8</text>
<text x="50.0" y="103.0" fill="#232a33" font-size="34" text-anchor="start" font-weight="700">二つの時間階層の切り替え</text>
<text x="50.0" y="141.0" fill="#5d6873" font-size="21" text-anchor="start" font-weight="400">名前を思い出そうとして会話を止めるとき、処理資源を記憶探索へ回している</text>
<line x1="50.0" y1="166.0" x2="1150.0" y2="166.0" stroke="#d8d4c8" stroke-width="1"/>
<rect x="70.0" y="200.0" width="440.0" height="340.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="290.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">感覚・運動ループ</text>
<text x="290.0" y="260.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">短い時間スケール</text>
<path d="M 318.8 325.4 A 80 80 0 0 1 369.0 412.3" fill="none" stroke="#2f8f83" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<path d="M 340.2 462.3 A 80 80 0 0 1 239.8 462.3" fill="none" stroke="#2f8f83" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<path d="M 211.0 412.3 A 80 80 0 0 1 261.2 325.4" fill="none" stroke="#2f8f83" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
<rect x="235.0" y="300.0" width="110.0" height="40.0" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="290.0" y="328.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">外界</text>
<rect x="304.3" y="420.0" width="110.0" height="40.0" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="359.3" y="448.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">感覚</text>
<rect x="165.7" y="420.0" width="110.0" height="40.0" rx="14" fill="#ffffff" stroke="#2f8f83" stroke-width="2"/>
<text x="220.7" y="448.0" fill="#2f8f83" font-size="14" text-anchor="middle" font-weight="700">行動</text>
<rect x="690.0" y="200.0" width="440.0" height="340.0" rx="16" fill="none" stroke="#c9c4b6" stroke-width="2" stroke-dasharray="8 7"/>
<text x="910.0" y="234.0" fill="#232a33" font-size="23" text-anchor="middle" font-weight="700">記憶の探索</text>
<text x="910.0" y="260.0" fill="#5d6873" font-size="14" text-anchor="middle" font-weight="400">長い時間スケール</text>
<rect x="800.0" y="480.0" width="220.0" height="28.0" rx="6" fill="#8a4f9e" stroke="none" stroke-width="0" opacity="0.25"/>
<rect x="809.0" y="444.0" width="202.0" height="28.0" rx="6" fill="#8a4f9e" stroke="none" stroke-width="0" opacity="0.37"/>
<rect x="818.0" y="408.0" width="184.0" height="28.0" rx="6" fill="#8a4f9e" stroke="none" stroke-width="0" opacity="0.49"/>
<rect x="827.0" y="372.0" width="166.0" height="28.0" rx="6" fill="#8a4f9e" stroke="none" stroke-width="0" opacity="0.61"/>
<rect x="836.0" y="336.0" width="148.0" height="28.0" rx="6" fill="#8a4f9e" stroke="none" stroke-width="0" opacity="0.73"/>
<text x="910.0" y="528.0" fill="#8a4f9e" font-size="14" text-anchor="middle" font-weight="700">蓄積された記憶の層をたどる</text>
<rect x="540.0" y="360.0" width="120.0" height="60.0" rx="30" fill="#ffffff" stroke="#c7792b" stroke-width="2"/>
<circle cx="620.0" cy="390.0" r="16" fill="#c7792b"/>
<text x="600.0" y="340.0" fill="#c7792b" font-size="14" text-anchor="middle" font-weight="700">処理資源の配分</text>
<line x1="560.0" y1="448.0" x2="650.0" y2="448.0" stroke="#c7792b" stroke-width="2" marker-end="url(#arrow-amber)"/>
<text x="600.0" y="476.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">会話を止めて</text>
<text x="600.0" y="494.0" fill="#5d6873" font-size="13" text-anchor="middle" font-weight="400">思い出すとき</text>
<text x="50.0" y="572.0" fill="#5d6873" font-size="19" text-anchor="start" font-weight="400">外界との関係を断つのではなく、注意と処理の配分を変えている。</text>
